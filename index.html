<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Precipitación</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .selectors { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        select { padding: 8px; font-size: 16px; min-width: 250px; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        .chart-container { width: 100%; height: 500px; margin-top: 20px; }
        .error { color: red; margin: 10px 0; }
        .debug { background: #f5f5f5; padding: 10px; margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Visualizador de Precipitación Mensual</h1>
        
        <div class="selectors">
            <div>
                <label for="departamento">Departamento:</label>
                <select id="departamento" disabled>
                    <option value="">Cargando departamentos...</option>
                </select>
            </div>
            
            <div>
                <label for="municipio">Municipio:</label>
                <select id="municipio" disabled>
                    <option value="">Seleccione un departamento primero</option>
                </select>
            </div>
            
            <button id="btnGraficar" disabled>Graficar Datos</button>
        </div>
        
        <div id="errorMsg" class="error" style="display: none;"></div>
        
        <div class="chart-container">
            <canvas id="precipitacionChart"></canvas>
        </div>
        
        <!-- Área de depuración (opcional) -->
        <div class="debug" id="debugInfo" style="display: none;">
            <h3>Información de Depuración</h3>
            <pre id="debugContent"></pre>
        </div>
    </div>

    <script>
        // Variables globales
        let precipitacionChart = null;
        let datosEstaciones = [];
        
        // Cuando el documento esté listo
        document.addEventListener('DOMContentLoaded', function() {
            // Configurar eventos
            document.getElementById('departamento').addEventListener('change', cargarMunicipios);
            document.getElementById('btnGraficar').addEventListener('click', graficarDatos);
            
            // Cargar los datos iniciales
            cargarDatos();
        });

        // Función para cargar datos
        async function cargarDatos() {
            try {
                // Mostrar estado de carga
                document.getElementById('departamento').innerHTML = '<option value="">Cargando datos...</option>';
                
                // Cargar el JSON (con timestamp para evitar caché)
                const response = await fetch('IDEAMpr.json?' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Verificar si los datos tienen el formato esperado
                if (!Array.isArray(data)) {
                    throw new Error('El formato del JSON no es válido. Se esperaba un array.');
                }
                
                // Procesar los datos
                datosEstaciones = data.map(item => {
                    // Si el item es un string (caso del JSON original)
                    if (typeof item === 'string') {
                        const partes = item.split(';');
                        return {
                            CODIGO: partes[0],
                            CATEGORIA: partes[1],
                            ESTACIÓN: partes[2],
                            MUNICIPIO: partes[3],
                            DEPARTAMENTO: partes[4],
                            // ... resto de propiedades
                        };
                    }
                    // Si ya es un objeto (formato limpio)
                    return item;
                });
                
                // Verificar que tenemos datos
                if (datosEstaciones.length === 0) {
                    throw new Error('El archivo JSON no contiene datos válidos.');
                }
                
                // Mostrar información de depuración (opcional)
                mostrarDebugInfo('Datos cargados correctamente', datosEstaciones);
                
                // Cargar departamentos
                cargarDepartamentos();
                
            } catch (error) {
                console.error('Error al cargar datos:', error);
                mostrarError(`Error al cargar los datos: ${error.message}`);
                
                // Mostrar información de depuración del error
                mostrarDebugInfo('Error al cargar datos', {
                    error: error.toString(),
                    stack: error.stack
                });
            }
        }

        // Función para cargar departamentos
        function cargarDepartamentos() {
            const selectDepto = document.getElementById('departamento');
            
            try {
                // Obtener departamentos únicos
                const departamentos = [...new Set(datosEstaciones.map(est => est.DEPARTAMENTO))].sort();
                
                // Llenar el select
                selectDepto.innerHTML = '<option value="">Seleccione un departamento</option>';
                departamentos.forEach(depto => {
                    const option = document.createElement('option');
                    option.value = depto;
                    option.textContent = depto;
                    selectDepto.appendChild(option);
                });
                
                // Habilitar controles
                selectDepto.disabled = false;
                document.getElementById('btnGraficar').disabled = false;
                
            } catch (error) {
                console.error('Error al cargar departamentos:', error);
                mostrarError(`Error al cargar departamentos: ${error.message}`);
            }
        }

        // Función para cargar municipios
        function cargarMunicipios() {
            const selectDepto = document.getElementById('departamento');
            const selectMuni = document.getElementById('municipio');
            
            try {
                const deptoSeleccionado = selectDepto.value;
                if (!deptoSeleccionado) return;
                
                // Filtrar municipios del departamento seleccionado
                const municipios = [...new Set(
                    datosEstaciones
                        .filter(est => est.DEPARTAMENTO === deptoSeleccionado)
                        .map(est => est.MUNICIPIO)
                )].sort();
                
                // Llenar el select
                selectMuni.innerHTML = '<option value="">Seleccione un municipio</option>';
                municipios.forEach(muni => {
                    const option = document.createElement('option');
                    option.value = muni;
                    option.textContent = muni;
                    selectMuni.appendChild(option);
                });
                
                // Habilitar el select
                selectMuni.disabled = false;
                
            } catch (error) {
                console.error('Error al cargar municipios:', error);
                mostrarError(`Error al cargar municipios: ${error.message}`);
            }
        }

        // Función para graficar los datos
        function graficarDatos() {
            const selectDepto = document.getElementById('departamento');
            const selectMuni = document.getElementById('municipio');
            
            try {
                // Validar selección
                if (!selectDepto.value || !selectMuni.value) {
                    throw new Error('Por favor seleccione un departamento y un municipio');
                }
                
                // Filtrar estaciones para el municipio seleccionado
                const estaciones = datosEstaciones.filter(est => 
                    est.DEPARTAMENTO === selectDepto.value && 
                    est.MUNICIPIO === selectMuni.value
                );
                
                if (estaciones.length === 0) {
                    throw new Error('No se encontraron estaciones para esta ubicación');
                }
                
                // Usar la primera estación encontrada (podrías modificar para mostrar múltiples)
                const estacion = estaciones[0];
                
                // Datos para el gráfico
                const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
                const precipitaciones = [
                    estacion.ENE, estacion.FEB, estacion.MAR, estacion.ABR, 
                    estacion.MAY, estacion.JUN, estacion.JUL, estacion.AGO, 
                    estacion.SEP, estacion.OCT, estacion.NOV, estacion.DIC
                ];
                
                // Crear o actualizar el gráfico
                const ctx = document.getElementById('precipitacionChart').getContext('2d');
                
                if (precipitacionChart) {
                    precipitacionChart.destroy();
                }
                
                precipitacionChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: meses,
                        datasets: [{
                            label: `Precipitación (mm) - ${estacion.ESTACIÓN}`,
                            data: precipitaciones,
                            backgroundColor: 'rgba(54, 162, 235, 0.7)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true, title: { display: true, text: 'Precipitación (mm)' } },
                            x: { title: { display: true, text: 'Meses del año' } }
                        }
                    }
                });
                
                // Limpiar mensajes de error
                document.getElementById('errorMsg').style.display = 'none';
                
            } catch (error) {
                console.error('Error al graficar:', error);
                mostrarError(error.message);
            }
        }

        // Función para mostrar errores
        function mostrarError(mensaje) {
            const errorElement = document.getElementById('errorMsg');
            errorElement.textContent = mensaje;
            errorElement.style.display = 'block';
        }

        // Función para depuración (opcional)
        function mostrarDebugInfo(titulo, datos) {
            const debugElement = document.getElementById('debugInfo');
            const contentElement = document.getElementById('debugContent');
            
            debugElement.style.display = 'block';
            contentElement.textContent = `${titulo}:\n${JSON.stringify(datos, null, 2)}`;
        }
    </script>
</body>
</html>
