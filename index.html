<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climatología del IDEAM 1991-2020</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* [Tus estilos existentes...] */
        
        /* Nuevos estilos para comparación */
        .comparison-controls {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .comparison-selector {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            align-items: center;
        }
        
        #btnAddComparison {
            background-color: #9b59b6;
            margin-top: 10px;
        }
        
        #btnAddComparison:hover {
            background-color: #8e44ad;
        }
        
        .remove-comparison {
            color: #e74c3c;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <!-- [Tus elementos existentes...] -->
    
    <!-- Añade esto después del botón "Graficar Datos" -->
    <button id="btnAddComparison" style="display: none;">
        <i class="fas fa-plus-circle"></i> Comparar con otra estación
    </button>
    
    <div id="comparisonControls" class="comparison-controls">
        <h3><i class="fas fa-balance-scale"></i> Modo Comparación</h3>
        <div id="comparisonContainer">
            <!-- Aquí se agregarán los selectores dinámicamente -->
        </div>
    </div>

    <script>
        // [Tus variables existentes...]
        let comparisonStations = [];
        
        // Modifica el evento DOMContentLoaded para añadir:
        document.getElementById('btnAddComparison').addEventListener('click', showComparisonControls);
        
        // Nueva función para mostrar controles de comparación
        function showComparisonControls() {
            const comparisonControls = document.getElementById('comparisonControls');
            comparisonControls.style.display = 'block';
            document.getElementById('btnAddComparison').style.display = 'none';
            addComparisonSelector();
        }
        
        // Función para añadir selectores de comparación
        function addComparisonSelector() {
            const container = document.getElementById('comparisonContainer');
            const selectorId = `comparison_${Date.now()}`;
            
            const selectorHTML = `
                <div class="comparison-selector" id="${selectorId}">
                    <select id="compDepto_${selectorId}" class="comparison-depto">
                        <option value="">Seleccione departamento</option>
                        ${document.getElementById('departamento').innerHTML}
                    </select>
                    <select id="compMuni_${selectorId}" class="comparison-muni" disabled>
                        <option value="">Seleccione departamento primero</option>
                    </select>
                    <select id="compEstacion_${selectorId}" class="comparison-estacion" disabled>
                        <option value="">Seleccione municipio primero</option>
                    </select>
                    <span class="remove-comparison" onclick="removeComparison('${selectorId}')">×</span>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', selectorHTML);
            
            // Agregar event listeners
            document.getElementById(`compDepto_${selectorId}`).addEventListener('change', function() {
                loadComparisonMunicipios(this.value, `compMuni_${selectorId}`);
            });
            
            document.getElementById(`compMuni_${selectorId}`).addEventListener('change', function() {
                loadComparisonStations(this.value, `compEstacion_${selectorId}`);
            });
            
            document.getElementById(`compEstacion_${selectorId}`).addEventListener('change', function() {
                updateComparisonChart();
            });
        }
        
        // Función para cargar municipios en comparación
        function loadComparisonMunicipios(depto, muniSelectId) {
            const selectMuni = document.getElementById(muniSelectId);
            const selectEstacion = document.getElementById(muniSelectId.replace('Muni', 'Estacion'));
            
            selectMuni.innerHTML = '<option value="">Cargando...</option>';
            selectMuni.disabled = true;
            selectEstacion.disabled = true;
            
            const municipios = [...new Set(
                datosEstaciones
                    .filter(est => est.DEPARTAMENTO === depto)
                    .map(est => est.MUNICIPIO)
            )].sort();
            
            selectMuni.innerHTML = '<option value="">Seleccione municipio</option>';
            municipios.forEach(muni => {
                const option = document.createElement('option');
                option.value = muni;
                option.textContent = muni;
                selectMuni.appendChild(option);
            });
            
            selectMuni.disabled = false;
        }
        
        // Función para cargar estaciones en comparación
        function loadComparisonStations(municipio, estacionSelectId) {
            const selectEstacion = document.getElementById(estacionSelectId);
            selectEstacion.innerHTML = '<option value="">Cargando...</option>';
            selectEstacion.disabled = true;
            
            const estaciones = datosEstaciones.filter(est => est.MUNICIPIO === municipio);
            
            selectEstacion.innerHTML = '<option value="">Seleccione estación</option>';
            estaciones.forEach((est, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${est.ESTACIÓN} (${est.CODIGO})`;
                selectEstacion.appendChild(option);
            });
            
            selectEstacion.disabled = false;
        }
        
        // Función para actualizar el gráfico con comparación
        function updateComparisonChart() {
            const mainStation = getSelectedStation();
            if (!mainStation) return;
            
            comparisonStations = [];
            
            // Obtener todas las estaciones seleccionadas para comparación
            document.querySelectorAll('.comparison-estacion').forEach(select => {
                if (select.value) {
                    const deptoSelect = select.id.replace('Estacion', 'Depto');
                    const muniSelect = select.id.replace('Estacion', 'Muni');
                    
                    const depto = document.getElementById(deptoSelect).value;
                    const muni = document.getElementById(muniSelect).value;
                    const index = select.value;
                    
                    const estaciones = datosEstaciones.filter(est => 
                        est.DEPARTAMENTO === depto && 
                        est.MUNICIPIO === muni
                    );
                    
                    if (estaciones[index]) {
                        comparisonStations.push(estaciones[index]);
                    }
                }
            });
            
            renderComparisonChart(mainStation, comparisonStations);
        }
        
        // Función para renderizar gráfico comparativo
        function renderComparisonChart(mainStation, stationsToCompare = []) {
            const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
            
            const datasets = [{
                label: `${mainStation.ESTACIÓN} (Principal)`,
                data: getMonthlyData(mainStation),
                backgroundColor: 'rgba(52, 152, 219, 0.7)',
                borderColor: 'rgba(52, 152, 219, 1)',
                borderWidth: 2
            }];
            
            // Colores para estaciones de comparación
            const comparisonColors = [
                'rgba(231, 76, 60, 0.7)',
                'rgba(46, 204, 113, 0.7)',
                'rgba(155, 89, 182, 0.7)',
                'rgba(241, 196, 15, 0.7)'
            ];
            
            stationsToCompare.forEach((station, index) => {
                datasets.push({
                    label: `${station.ESTACIÓN} (Comparación)`,
                    data: getMonthlyData(station),
                    backgroundColor: comparisonColors[index % comparisonColors.length],
                    borderColor: darkenColor(comparisonColors[index % comparisonColors.length]),
                    borderWidth: 2,
                    borderDash: [5, 5]
                });
            });
            
            const ctx = document.getElementById('precipitacionChart').getContext('2d');
            
            if (precipitacionChart) {
                precipitacionChart.destroy();
            }
            
            precipitacionChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: meses,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Precipitación (mm)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Meses del año'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                boxWidth: 12,
                                padding: 20
                            }
                        }
                    }
                }
            });
        }
        
        // Función auxiliar para oscurecer colores (para bordes)
        function darkenColor(color) {
            return color.replace('0.7', '1');
        }
        
        // Función para obtener datos mensuales
        function getMonthlyData(station) {
            return [
                station.ENE, station.FEB, station.MAR, station.ABR,
                station.MAY, station.JUN, station.JUL, station.AGO,
                station.SEP, station.OCT, station.NOV, station.DIC
            ];
        }
        
        // Función para remover un selector de comparación
        function removeComparison(id) {
            document.getElementById(id).remove();
            if (document.querySelectorAll('.comparison-selector').length === 0) {
                document.getElementById('comparisonControls').style.display = 'none';
                document.getElementById('btnAddComparison').style.display = 'block';
            }
            updateComparisonChart();
        }
        
        // Modifica la función graficarDatos para habilitar la comparación
        function graficarDatos() {
            // [Tu código existente...]
            
            // Al final de la función, añade:
            document.getElementById('btnAddComparison').style.display = 'block';
            updateComparisonChart();
        }
    </script>
</body>
</html>
